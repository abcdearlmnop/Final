<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside Sim – every scheduled NBA game, simulated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --raised:#e9edf2; --line:#dde2e9;
  --text:#18202b; --muted:#667180; --good:#1f9d63; --bad:#d4483b; --mid:#c98a12;
  --hot:#0f8f86; --teamA:#3a6fd8; --teamB:#c98a12;
  --num:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171e; --surface:#1a2129; --raised:#232c37; --line:#2b3542;
    --text:#ebeff4; --muted:#8e99a8; --good:#3cc786; --bad:#f06a5d; --mid:#e6a93a; --hot:#2fc4b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1a2129; --raised:#232c37; --line:#2b3542;
  --text:#ebeff4; --muted:#8e99a8; --good:#3cc786; --bad:#f06a5d; --mid:#e6a93a; --hot:#2fc4b8;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 0 40px}
.n{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .midc{color:var(--mid)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font:700 22px/1.1 var(--body);letter-spacing:-.01em}
.brand .btns{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.datebar{display:flex;align-items:center;gap:6px;padding:0 14px}
.datebar button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:18px}
.datebar .d{flex:1;text-align:center;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0}
.quick{display:flex;gap:6px;padding:8px 14px 0}
.quick button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.quick button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 14px 8px}
.settings label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.settings label:first-child{margin-top:0}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}

.section{padding:12px 14px 0}
.section h2{font-size:14px;font-weight:600;color:var(--muted);margin:4px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.games{display:grid;gap:8px}
.game{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.game:hover{border-color:var(--muted)}
.game .gr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.game .tm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.game .tm:last-child{justify-content:flex-end}
.game .tm small{font-weight:400;color:var(--muted);font-size:12px}
.game img{width:30px;height:30px;flex:none}
.game .mid{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.game .res{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.game .res .n{font-size:18px}
.game .res .tap{color:var(--muted)}
.go{border:0;background:var(--text);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.go:disabled{opacity:.5;cursor:default}

.hero{margin:4px 14px 0;border-radius:18px;padding:40px 16px 14px;color:#fff;background:linear-gradient(110deg,var(--teamA) 0%,color-mix(in srgb,var(--teamA) 70%,#000) 49%,color-mix(in srgb,var(--teamB) 70%,#000) 51%,var(--teamB) 100%);position:relative}
.hero .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.hero .side{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hero .side img{width:56px;height:56px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.hero .side small{font-weight:500;font-size:12px;opacity:.9}
.hero .at{font:700 24px/1 var(--num);opacity:.9}
.hero .odds{text-align:center;font-size:13px;margin-top:10px;opacity:.95;font-weight:500}
.back{position:absolute;top:10px;left:10px;border:0;background:rgba(0,0,0,.28);color:#fff;border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.rerun{position:absolute;top:10px;right:10px;border:0;background:rgba(0,0,0,.28);color:#fff;border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:12px 14px 0;overflow:hidden}
.card > h3{margin:0;padding:12px 14px;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card > h3 small{font-weight:400;color:var(--muted);font-size:12.5px}

.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 14px 4px;gap:8px}
.score .s{display:flex;align-items:center;gap:10px}
.score .s:last-child{justify-content:flex-end}
.score .s img{width:38px;height:38px}
.score .s .n{font-size:46px;line-height:1}
.score .dash{color:var(--muted);font:600 26px/1 var(--num)}
.score .win{color:var(--good)}
.wp{padding:6px 14px 12px}
.wp .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.wp .track{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:5px;background:var(--raised)}
.wp .track i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:2px 14px 12px;font-size:13.5px;align-items:baseline}
.kv .n{font-size:18px;text-align:right}
.kv .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-2px 0 6px}
.actual{margin:0 14px 12px;background:var(--raised);border-radius:10px;padding:8px 10px;font-size:13px}

.hist{padding:8px 10px 4px}
.hist svg{width:100%;height:auto;display:block}
.hist .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px 8px}

.fac{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.fac:first-of-type{border-top:0}
.fac .t{font-weight:600;font-size:14px}
.fac .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.fac .v{text-align:right;line-height:1.05}
.fac .v .n{font-size:20px;display:block}
.fac .v span{font-size:11.5px;color:var(--muted)}
.fac.total{background:var(--raised)}

.inj-row{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;padding:9px 14px;border-top:1px solid var(--line);align-items:center;font-size:13.5px}
.inj-row:first-of-type{border-top:0}
.inj-row .sub{font-size:12px;color:var(--muted)}
.inj-row .n{font-size:17px;text-align:right}
.pill{font-size:11.5px;font-weight:700;border-radius:12px;padding:2px 8px;white-space:nowrap}
.pill.out{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.pill.q{background:color-mix(in srgb,var(--mid) 18%,var(--surface));color:var(--mid)}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}

.tabs{display:flex;gap:4px;padding:10px 14px 0}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button img{width:20px;height:20px}
.tabs button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.plist{padding-top:8px}
.plist .pr{display:grid;grid-template-columns:1fr 34px 36px 34px 34px 34px;gap:4px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.plist .pr.hd{cursor:default;color:var(--muted);font-size:12px;padding-top:4px;padding-bottom:6px;border-top:0}
.plist .pr .n{text-align:right;font-size:17px}
.plist .pr.hd span:not(:first-child){text-align:right}
.plist .pr .who{min-width:0;display:flex;align-items:center;gap:8px}
.plist .pr .who img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;background:var(--raised);flex:none}
.plist .pr .who span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;line-height:1.2}
.plist .pr .who small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.plist .pr.dim{opacity:.55}
.detail{background:var(--raised);padding:10px 14px 12px;border-top:1px solid var(--line)}
.detail table{background:var(--surface);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 6px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--muted);font-weight:500;font-size:12px}
td.n{font-size:16px}
.why{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.why b{color:var(--text);font-weight:600}

.empty{padding:26px 22px;text-align:center;color:var(--muted)}
.err{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:14px;padding:12px 14px;margin:12px 14px;font-size:14px}
.loading{padding:36px 22px;text-align:center;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--hot);animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.bar{height:6px;background:var(--raised);border-radius:4px;overflow:hidden;max-width:260px;margin:10px auto 0}
.bar i{display:block;height:100%;background:var(--hot);transition:width .2s}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;padding:0 18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Courtside Sim</h1>
      <div class="btns"><button class="iconbtn" id="setbtn" aria-expanded="false">Settings</button></div>
    </div>
  </div>
  <div id="settings" hidden></div>
  <div id="app"></div>
  <p class="note">Simulations use ESPN box scores, injury reports and schedules, plus Vegas lines. Results are probabilities, not guarantees.</p>
</div>

<script>
/* ================= constants ================= */
// id, abbr, name, time zone (hours from Eastern)
const TEAMS = [
 [1,"ATL","Hawks",0],[2,"BOS","Celtics",0],[17,"BKN","Nets",0],[30,"CHA","Hornets",0],[4,"CHI","Bulls",-1],
 [5,"CLE","Cavaliers",0],[6,"DAL","Mavericks",-1],[7,"DEN","Nuggets",-2],[8,"DET","Pistons",0],[9,"GS","Warriors",-3],
 [10,"HOU","Rockets",-1],[11,"IND","Pacers",0],[12,"LAC","Clippers",-3],[13,"LAL","Lakers",-3],[29,"MEM","Grizzlies",-1],
 [14,"MIA","Heat",0],[15,"MIL","Bucks",-1],[16,"MIN","Timberwolves",-1],[3,"NO","Pelicans",-1],[18,"NY","Knicks",0],
 [25,"OKC","Thunder",-1],[19,"ORL","Magic",0],[20,"PHI","76ers",0],[21,"PHX","Suns",-2],[22,"POR","Trail Blazers",-3],
 [23,"SAC","Kings",-3],[24,"SA","Spurs",-1],[28,"TOR","Raptors",0],[26,"UTAH","Jazz",-2],[27,"WSH","Wizards",0]
].map(([id,abbr,name,tz])=>({id:String(id),abbr,name,tz,logo:`https://a.espncdn.com/i/teamlogos/nba/500/${abbr.toLowerCase()}.png`}));
const teamById = id => TEAMS.find(t=>t.id===String(id));
const tzOf = id => teamById(id)?.tz ?? 0;
const ALTITUDE = {"7":"Denver","26":"Salt Lake City"};
const S = "https://site.api.espn.com/apis";

const HCA = 2.2;          // league home-court edge, points
const REPLACEMENT = 9;    // game score per 36 of a replacement-level player
// box row: [id,pos,min,fgm,fga,tpm,tpa,ftm,fta,oreb,dreb,reb,ast,stl,blk,tov,pf,pts,starter,name]
const B = {id:0,pos:1,min:2,fgm:3,fga:4,tpm:5,tpa:6,ftm:7,fta:8,oreb:9,dreb:10,reb:11,ast:12,stl:13,blk:14,tov:15,pf:16,pts:17,st:18,name:19};

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const sd = a => { if(a.length<2) return NaN; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const f1 = x => isFinite(x) ? x.toFixed(1) : "–";
const sgn = x => (x>0?"+":x<0?"−":"") + Math.abs(x).toFixed(1);
const pct = x => isFinite(x) ? Math.round(x*100)+"%" : "–";
const head = id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const lastName = n => String(n||"").split(" ").slice(-1)[0];
const seasonYear = () => { const d=new Date(); return d.getMonth()>=8 ? d.getFullYear()+1 : d.getFullYear(); };
function posGroup(pos){ pos=String(pos||"").toUpperCase(); if(pos.includes("C")) return "C"; if(pos.includes("G")) return "G"; if(pos.includes("F")) return "F"; return "F"; }
const POS_NAME = {G:"guards", F:"forwards", C:"centers"};
const tick = () => new Promise(r=>setTimeout(r,30));
const cleanColor = c => c && /^[0-9a-f]{6}$/i.test(c) && !/^(000000|ffffff)$/i.test(c) ? "#"+c : null;

// dates are handled as US Eastern calendar days, like the NBA schedule
const etYMD = d => new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(d).replace(/-/g,"");
const ymdUTC = y => Date.UTC(+y.slice(0,4), +y.slice(4,6)-1, +y.slice(6,8));
const shiftDay = (y,n) => new Date(ymdUTC(y)+n*864e5).toISOString().slice(0,10).replace(/-/g,"");
const etDayNum = ms => Math.round(ymdUTC(etYMD(new Date(ms)))/864e5);
function dayLabel(y){
  const today = etYMD(new Date());
  const s = new Date(ymdUTC(y)+12*3600e3).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
  return y===today ? `Today · ${s}` : y===shiftDay(today,1) ? `Tomorrow · ${s}` : y===shiftDay(today,-1) ? `Yesterday · ${s}` : s;
}

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const settings = Object.assign({sims:10000, win:15, vegas:0.25}, LS.get("csim_settings", {}));
const saveSettings = () => LS.set("csim_settings", settings);

async function getJSON(url){
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    const r = await fetch("https://corsproxy.io/?url="+encodeURIComponent(url));
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }
}
const soft = p => p.catch(()=>null);
async function runPool(items, n, fn){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n,items.length)}, async()=>{
    while(i<items.length){ const it = items[i++]; try{ await fn(it); }catch(e){} }
  }));
}

/* ================= random ================= */
function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function gamma(k){ // Marsaglia–Tsang, k >= 1, mean k
  const d=k-1/3, c=1/Math.sqrt(9*d);
  for(;;){ let x, v; do{ x=gauss(); v=1+c*x; }while(v<=0); v=v*v*v; const u=Math.random();
    if(u<1-0.0331*x*x*x*x || Math.log(u)<0.5*x*x+d*(1-v+Math.log(v))) return d*v; }
}
function poisson(l){
  if(l<=0) return 0;
  if(l>30) return Math.max(0, Math.round(l+Math.sqrt(l)*gauss()));
  const L=Math.exp(-l); let k=0, p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1;
}
const negbin = (m, k) => m<=0 ? 0 : poisson(m*gamma(k)/k);   // counts with extra spread

/* ================= state ================= */
const state = {day: etYMD(new Date()), autoAdvanced:false, games:null, gamesErr:null, view:"home", game:null,
               sched:{}, rosters:{}, results:{}, M:null, R:null, tab:null, open:null, simAll:null};
const POS = {};

/* ================= data: schedules, rosters, box scores ================= */
async function teamSchedule(id){
  const key = "csim_sched_"+id, c = LS.get(key, null);
  if(c && c.y===seasonYear() && Date.now()-c.t < 1.5*3600e3) return c.g;
  const j = await getJSON(`${S}/site/v2/sports/basketball/nba/teams/${id}/schedule`);
  const g = (j.events||[]).map(e=>{
    const c = e.competitions?.[0], st = c?.status?.type || e.status?.type || {};
    const typ = e.seasonType?.type ?? e.seasonType?.id ?? c?.type?.id;
    const comps = c?.competitors||[];
    const me = comps.find(x=>String(x.team?.id||x.id)===String(id)), op = comps.find(x=>x!==me);
    return {id:String(e.id||c?.id||""), d:Date.parse(e.date), done:!!st.completed || st.state==="post", pre:String(typ)==="1",
            home: me?.homeAway==="home", opp:String(op?.team?.id||op?.id||"")};
  }).filter(x=>x.id && !x.pre && isFinite(x.d)).sort((a,b)=>b.d-a.d);
  LS.set(key, {t:Date.now(), y:seasonYear(), g});
  return g;
}
function parseRoster(j){
  let list = j?.athletes||[];
  if(list.length && list[0].items) list = list.flatMap(x=>x.items||[]);
  return list.map(a=>{
    const inj = a.injuries?.[0];
    return {id:String(a.id), name:a.displayName||a.fullName||"", pos:a.position?.abbreviation||"",
            status: inj ? (inj.status||inj.type?.description||"Injured") : "",
            why: inj ? (inj.details?.type || inj.shortComment || inj.longComment || "") : ""};
  });
}
async function teamRoster(id){
  const r = parseRoster(await getJSON(`${S}/site/v2/sports/basketball/nba/teams/${id}/roster`));
  r.forEach(p=>{ if(p.pos) POS[p.id]=p.pos; });
  return state.rosters[id] = r;
}
function playProb(st){
  const s = String(st||"").toLowerCase();
  if(!s) return 1;
  if(/out|suspend|inactive|injured reserve/.test(s)) return 0;
  if(/doubt/.test(s)) return 0.2;
  if(/question|game.?time/.test(s)) return 0.5;
  if(/probable/.test(s)) return 0.9;
  if(/day.?to.?day/.test(s)) return 0.6;
  return 0.75;
}
const pillClass = p => p===0 ? "out" : p<1 ? "q" : "ok";

const BOX_KEY = "csim_box_"+seasonYear();
let BOX = LS.get(BOX_KEY, {});
function saveBox(){
  if(LS.set(BOX_KEY, BOX)) return;
  const ids = Object.keys(BOX).sort((a,b)=>(BOX[b].d||0)-(BOX[a].d||0));
  ids.slice(Math.floor(ids.length*0.6)).forEach(id=>delete BOX[id]);
  LS.set(BOX_KEY, BOX);
}
function parseBox(j){
  const comp = j?.header?.competitions?.[0];
  const out = {d:Date.parse(comp?.date)||0, t:[]};
  const hc = (comp?.competitors||[]).find(c=>c.homeAway==="home");
  const homeId = String(hc?.id || hc?.team?.id || "");
  for(const t of (j?.boxscore?.players||[])){
    const st = t.statistics?.[0]||{}, L = st.labels||[], N = st.names||[], K = st.keys||[];
    const ix = (lab, ...nm) => { let i=L.indexOf(lab); for(const x of nm){ if(i<0) i=N.indexOf(x); if(i<0) i=K.indexOf(x); } return i; };
    const iM=ix("MIN","minutes"), iFG=ix("FG","fieldGoalsMade-fieldGoalsAttempted"), i3=ix("3PT","threePointFieldGoalsMade-threePointFieldGoalsAttempted"),
          iFT=ix("FT","freeThrowsMade-freeThrowsAttempted"), iOR=ix("OREB","offensiveRebounds"), iDR=ix("DREB","defensiveRebounds"),
          iR=ix("REB","rebounds","totalRebounds"), iA=ix("AST","assists"), iS=ix("STL","steals"), iB=ix("BLK","blocks"),
          iTO=ix("TO","turnovers"), iPF=ix("PF","fouls"), iP=ix("PTS","points");
    const ps = [];
    for(const a of (st.athletes||[])){
      if(a.didNotPlay || !a.stats?.length) continue;
      const s = a.stats;
      const n = i => { const v = i>=0 ? parseFloat(s[i]) : NaN; return isFinite(v) ? v : 0; };
      const part = (i,k) => { if(i<0) return 0; return parseFloat(String(s[i]).split("-")[k])||0; };
      const min = n(iM); if(!(min>0)) continue;
      ps.push([String(a.athlete?.id||""), a.athlete?.position?.abbreviation||"", min, part(iFG,0), part(iFG,1), part(i3,0), part(i3,1),
               part(iFT,0), part(iFT,1), n(iOR), n(iDR), n(iR), n(iA), n(iS), n(iB), n(iTO), n(iPF), n(iP), a.starter?1:0, a.athlete?.displayName||""]);
    }
    out.t.push({id:String(t.team?.id||""), p:ps, h: String(t.team?.id||"")===homeId ? 1 : 0});
  }
  return out.t.length===2 && out.t.every(x=>x.p.length) ? out : null;
}

const sampleGames = (id, t) => (state.sched[id]||[]).filter(e=>e.done && e.d < t-2*3600e3).slice(0, settings.win || 999);
const sum = (side, k) => side.p.reduce((s,p)=>s+p[k],0);
const possOf = side => side.p.reduce((s,p)=>s+p[B.fga]+0.44*p[B.fta]-p[B.oreb]+p[B.tov],0);
const gameScore = p => p[B.pts]+0.4*p[B.fgm]-0.7*p[B.fga]-0.4*(p[B.fta]-p[B.ftm])+0.7*p[B.oreb]+0.3*p[B.dreb]+p[B.stl]+0.7*p[B.ast]+0.7*p[B.blk]-0.4*p[B.pf]-p[B.tov];

async function loadForGame(G, step){
  const t = G.date.getTime(), ids = [G.away.id, G.home.id];
  step("Loading schedules…", 0.04);
  await Promise.all(ids.map(async id=>{ state.sched[id] = await teamSchedule(id); }));
  step("Checking injury reports…", 0.1);
  await Promise.all(ids.map(id=>soft(teamRoster(id))));
  const need = [...new Set(ids.flatMap(id=>sampleGames(id,t).map(g=>g.id)))].filter(id=>!BOX[id]);
  let done = 0;
  await runPool(need, 8, async gid=>{
    const b = parseBox(await getJSON(`${S}/site/v2/sports/basketball/nba/summary?event=${gid}`));
    if(b) BOX[gid] = b;
    done++;
    if(done%3===0 || done===need.length) step(`Reading box scores… ${done} of ${need.length}`, 0.12 + 0.82*done/need.length);
  });
  if(need.length) saveBox();
}

/* ================= league + team ratings ================= */
function leagueBase(t){
  let poss=0, pts=0, paces=[], n=0;
  const dv = {G:{pts:0,reb:0,ast:0,tpm:0},F:{pts:0,reb:0,ast:0,tpm:0},C:{pts:0,reb:0,ast:0,tpm:0}};
  for(const id in BOX){
    const b = BOX[id]; if(!b || b.d >= t-2*3600e3) continue;
    const [x,y] = b.t; const px=possOf(x), py=possOf(y);
    const mins = sum(x,B.min)/5, sc = 48/Math.max(48,mins);
    paces.push((px+py)/2*sc);
    for(const s of [x,y]){
      poss += possOf(s); pts += sum(s,B.pts); n++;
      for(const p of s.p){ const g=posGroup(p[B.pos]||POS[p[0]]); dv[g].pts+=p[B.pts]; dv[g].reb+=p[B.reb]; dv[g].ast+=p[B.ast]; dv[g].tpm+=p[B.tpm]; }
    }
  }
  if(n<12) return {pace:99.5, rtg:114.5, dvp:null, n};
  for(const g in dv) for(const k in dv[g]) dv[g][k] /= n;
  return {pace:mean(paces), rtg:100*pts/poss, dvp:dv, n};
}

function teamRatings(id, t, lg){
  const rows = [];
  for(const g of sampleGames(id, t)){
    const b = BOX[g.id]; if(!b) continue;
    const me = b.t.find(x=>x.id===id), op = b.t.find(x=>x.id!==id); if(!me||!op) continue;
    const pm = possOf(me), po = possOf(op), mins = sum(me,B.min)/5;
    rows.push({gid:g.id, d:b.d, home:!!me.h, me, op, opp:op.id, pf:sum(me,B.pts), pa:sum(op,B.pts), pm, po, pace:(pm+po)/2*48/Math.max(48,mins)});
  }
  rows.sort((a,b)=>b.d-a.d);
  const n = rows.length;
  const pool = rs => rs.length ? 100*(rs.reduce((s,r)=>s+r.pf,0)/rs.reduce((s,r)=>s+r.pm,0) - rs.reduce((s,r)=>s+r.pa,0)/rs.reduce((s,r)=>s+r.po,0)) : NaN;
  const out = {n, rows, pace:lg.pace, ortg:lg.rtg, drtg:lg.rtg, net:0, l5:NaN, homeNet:NaN, roadNet:NaN, nh:0, nr:0, ppg:NaN, dvp:null};
  if(!n) return out;
  let ortg = 100*rows.reduce((s,r)=>s+r.pf,0)/rows.reduce((s,r)=>s+r.pm,0);
  let drtg = 100*rows.reduce((s,r)=>s+r.pa,0)/rows.reduce((s,r)=>s+r.po,0);
  const hr = rows.filter(r=>r.home), rr = rows.filter(r=>!r.home);
  // take out the home/road mix of the schedule so far, then regress small samples to league average
  const nudge = (HCA/2)*(hr.length-rr.length)/n;
  ortg -= nudge; drtg += nudge;
  const k = 4;
  out.ortg = (n*ortg + k*lg.rtg)/(n+k);
  out.drtg = (n*drtg + k*lg.rtg)/(n+k);
  out.pace = (n*mean(rows.map(r=>r.pace)) + k*lg.pace)/(n+k);
  out.net = out.ortg - out.drtg;
  out.rawNet = pool(rows);
  out.l5 = pool(rows.slice(0,5));
  out.homeNet = pool(hr); out.roadNet = pool(rr); out.nh = hr.length; out.nr = rr.length;
  out.ppg = mean(rows.map(r=>r.pf));
  // what this defense allows by position
  const dv = {G:{pts:[],reb:[],ast:[],tpm:[]},F:{pts:[],reb:[],ast:[],tpm:[]},C:{pts:[],reb:[],ast:[],tpm:[]}};
  for(const r of rows){
    const s = {G:{pts:0,reb:0,ast:0,tpm:0},F:{pts:0,reb:0,ast:0,tpm:0},C:{pts:0,reb:0,ast:0,tpm:0}};
    for(const p of r.op.p){ const g=posGroup(p[B.pos]||POS[p[0]]); s[g].pts+=p[B.pts]; s[g].reb+=p[B.reb]; s[g].ast+=p[B.ast]; s[g].tpm+=p[B.tpm]; }
    for(const g in s) for(const x in s[g]) dv[g][x].push(s[g][x]);
  }
  out.dvp = {}; for(const g in dv){ out.dvp[g] = {}; for(const x in dv[g]) out.dvp[g][x] = mean(dv[g][x]); }
  return out;
}

/* ================= rest, travel, schedule spot ================= */
function scheduleSpot(id, G, isHome){
  const t = G.date.getTime(), today = etDayNum(t);
  const prior = (state.sched[id]||[]).filter(e=>e.d < t-3*3600e3).sort((a,b)=>b.d-a.d);
  const last = prior[0];
  const rest = last ? today - etDayNum(last.d) - 1 : 7;
  const notes = []; let v = 0;
  const b2b = rest===0;
  if(b2b){
    v -= 1.8; notes.push(["Second night of a back-to-back", -1.8]);
    if(!isHome && !last.home){ v -= 0.6; notes.push(["Both nights on the road", -0.6]); }
    const from = last.home ? id : last.opp, zones = Math.abs(tzOf(from) - tzOf(G.home.id));
    if(zones>=2){ v -= 0.5; notes.push([`Overnight flight across ${zones} time zones`, -0.5]); }
  } else if(rest>=3 && rest<10){ v += 0.4; notes.push([`${rest} days of rest`, 0.4]); }
  const in4 = 1 + prior.filter(e=>today-etDayNum(e.d) <= 3).length;
  const in6 = 1 + prior.filter(e=>today-etDayNum(e.d) <= 5).length;
  if(in4>=3){ v -= 0.6; notes.push([`${in4} games in 4 nights`, -0.6]); }
  else if(in6>=4){ v -= 0.4; notes.push([`${in6} games in 6 nights`, -0.4]); }
  let trip = 0;
  if(!isHome){ trip = 1; for(const e of prior){ if(e.home) break; trip++; } if(trip>=4){ v -= 0.5; notes.push([`Game ${trip} of a road trip`, -0.5]); } }
  return {v, notes, rest, b2b, trip};
}

/* ================= players ================= */
function buildPlayers(teamId, R, Ro, lg, P, isHome, spot){
  const roster = state.rosters[teamId] || [];
  const logs = new Map();
  R.rows.forEach((r,ri)=>{ for(const p of r.me.p){
    if(!logs.has(p[0])) logs.set(p[0], []);
    logs.get(p[0]).push({ri, home:r.home, min:p[B.min], pts:p[B.pts], reb:p[B.reb], ast:p[B.ast], tpm:p[B.tpm], gm:gameScore(p), st:p[B.st], pos:p[B.pos]});
  }});
  const perMin = (gs,k) => { const m = gs.reduce((s,g)=>s+g.min,0); return m>0 ? gs.reduce((s,g)=>s+g[k],0)/m : NaN; };
  const out = [], unknown = [];
  for(const r of roster){
    const log = logs.get(r.id) || [];
    const prob = playProb(r.status);
    if(!log.length){ if(r.status) unknown.push({...r, prob}); continue; }
    const r10 = log.slice(0,10), w = r10.map((_,i)=>Math.pow(0.85,i));
    let min = r10.reduce((s,g,i)=>s+g.min*w[i],0)/w.reduce((a,b)=>a+b,0);
    const totMin = log.reduce((s,g)=>s+g.min,0);
    const gm36 = 36*(log.reduce((s,g)=>s+g.gm,0) + REPLACEMENT/36*24)/(totMin+24);
    const share = log.length / Math.max(1,R.n);
    const rs = log.filter(x=>x.ri<5).length / Math.max(1, Math.min(5,R.n));
    const impact = clamp((gm36-REPLACEMENT)*min/48*0.45, -0.5, 7);
    const g = posGroup(r.pos || log[0].pos || POS[r.id]);
    const notes = [];
    const rate = {};
    for(const k of ["pts","reb","ast","tpm"]){
      const a = perMin(r10,k), b = perMin(log,k);
      rate[k] = isFinite(a)&&isFinite(b) ? 0.55*a+0.45*b : (isFinite(b)?b:0);
    }
    // venue split (shrunk heavily)
    const venue = log.filter(x=>x.home===isHome);
    if(venue.length>=2){
      const f = clamp(1 + (perMin(venue,"pts")/perMin(log,"pts") - 1)*venue.length/(venue.length+12), 0.93, 1.07);
      if(isFinite(f)){ rate.pts *= f; if(Math.abs(f-1)>=0.02) notes.push(`Scores ${Math.round(Math.abs(f-1)*100)}% ${f>1?"more":"less"} per minute ${isHome?"at home":"on the road"}`); }
    }
    // opponent defense vs his position
    const oppF = {};
    for(const k of ["pts","reb","ast","tpm"]){
      const a = Ro.dvp?.[g]?.[k], b = lg.dvp?.[g]?.[k];
      const e = k==="pts" ? 0.45 : 0.5;
      oppF[k] = a>0 && b>0 ? clamp(Math.pow(a/b, e)*(Ro.n/(Ro.n+3)) + 3/(Ro.n+3), 0.85, 1.15) : 1;
      rate[k] *= oppF[k];
    }
    // pace
    const env = clamp(P/R.pace, 0.93, 1.07);
    rate.reb *= Math.pow(env,0.6); rate.ast *= Math.pow(env,0.8); rate.tpm *= env;
    if(spot.b2b){ min *= 0.97; }
    const ptsSeries = log.map(x=>x.pts);
    const cv = clamp(0.7*(sd(ptsSeries)/Math.max(1,mean(ptsSeries))), 0.18, 0.6);
    out.push({id:r.id, name:r.name, pos:r.pos||log[0].pos||"", g, status:r.status, why:r.why, prob, share, rs, impact, gm36, min, rate, oppF, env, cv, notes, gp:log.length});
  }
  out.sort((a,b)=>b.min-a.min);
  // likely starters: top five by minutes among those expected to play
  out.filter(p=>p.prob>=0.5).slice(0,5).forEach(p=>p.starter=true);
  return {players: out, unknown};
}

/* ================= model ================= */
function vegasNumbers(G){
  const o = G.odds||{};
  let vM = NaN;
  if(isFinite(o.spread)) vM = o.fav===G.home.id ? o.spread : o.fav===G.away.id ? -o.spread : 0;
  return {vM, vT: isFinite(o.total) ? o.total : NaN};
}

function buildModel(G){
  const t = G.date.getTime(), H = G.home, A = G.away;
  const lg = leagueBase(t);
  const RH = teamRatings(H.id, t, lg), RA = teamRatings(A.id, t, lg);
  const P = RH.pace*RA.pace/lg.pace;
  const ptsH0 = P*(RH.ortg*RA.drtg/lg.rtg)/100, ptsA0 = P*(RA.ortg*RH.drtg/lg.rtg)/100;
  const spotH = scheduleSpot(H.id, G, true), spotA = scheduleSpot(A.id, G, false);
  const PH = buildPlayers(H.id, RH, RA, lg, P, true, spotH), PA = buildPlayers(A.id, RA, RH, lg, P, false, spotA);
  const F = [];   // each factor in home-margin points

  F.push({k:"base", t:"Team strength", v:ptsH0-ptsA0,
    d:`Net rating over the last ${Math.max(RH.n,RA.n)} games, home/road mix removed: ${H.abbr} ${sgn(RH.net)}, ${A.abbr} ${sgn(RA.net)} per 100. Pace ${f1(P)}.`});
  const form = R => R.n>=5 && isFinite(R.l5) ? clamp(0.3*(R.l5-R.rawNet), -3, 3)*P/100 : 0;
  const fH = form(RH), fA = form(RA);
  F.push({k:"form", t:"Recent form", v:fH-fA,
    d:`Last 5 games vs their sample: ${H.abbr} ${sgn(isFinite(RH.l5)?RH.l5-RH.rawNet:0)}, ${A.abbr} ${sgn(isFinite(RA.l5)?RA.l5-RA.rawNet:0)} net per 100 (30% weight).`});
  F.push({k:"hca", t:"Home court", v:HCA, d:`${H.name} at home. League-wide home edge.`});
  const split = R => R.nh>=2 && R.nr>=2 ? clamp(((R.homeNet-R.roadNet)/2 - HCA)*Math.min(R.nh,R.nr)/(Math.min(R.nh,R.nr)+12)*0.5, -1.5, 1.5) : 0;
  const sH = split(RH), sA = split(RA);
  F.push({k:"split", t:"Home/road splits", v:sH+sA,
    d:`${H.abbr} home net ${isFinite(RH.homeNet)?sgn(RH.homeNet):"–"} (${RH.nh} g), ${A.abbr} road net ${isFinite(RA.roadNet)?sgn(RA.roadNet):"–"} (${RA.nr} g); shrunk toward the league norm.`});
  const restTxt = (ab, s) => s.notes.length ? `${ab}: ${s.notes.map(n=>`${n[0].toLowerCase()} (${sgn(n[1])})`).join(", ")}` : `${ab}: ${s.rest>=7?"first game of the stretch":s.rest+" day"+(s.rest===1?"":"s")+" rest"}`;
  F.push({k:"rest", t:"Rest, travel and schedule", v:spotH.v-spotA.v, d:`${restTxt(H.abbr,spotH)}. ${restTxt(A.abbr,spotA)}.`});
  if(ALTITUDE[H.id]){
    const v = 0.7 + (spotA.b2b ? 0.4 : 0);
    F.push({k:"alt", t:"Altitude", v, d:`${A.abbr} playing at elevation in ${ALTITUDE[H.id]}${spotA.b2b?", on a back-to-back":""}.`});
  }
  const expAv = list => list.reduce((s,p)=>s+(p.prob-p.share)*p.impact,0);
  const avH = expAv(PH.players), avA = expAv(PA.players);
  const avTxt = (ab, list) => {
    const m = list.filter(p=>Math.abs((p.prob-p.share)*p.impact)>=0.3).sort((a,b)=>Math.abs((b.prob-b.share)*b.impact)-Math.abs((a.prob-a.share)*a.impact)).slice(0,3);
    return m.length ? `${ab}: ${m.map(p=>`${lastName(p.name)} ${p.prob===0?"out":p.prob<1?Math.round(p.prob*100)+"% to play":"back"} (${sgn((p.prob-p.share)*p.impact)})`).join(", ")}` : `${ab}: no change from the usual lineup`;
  };
  F.push({k:"avail", t:"Player availability", v:avH-avA, d:`${avTxt(H.abbr,PH.players)}. ${avTxt(A.abbr,PA.players)}. Questionable players are coin-flipped in every simulation.`});

  const shiftConst = F.filter(f=>f.k!=="base" && f.k!=="avail").reduce((s,f)=>s+f.v,0);
  let meanH = ptsH0 + shiftConst/2, meanA = ptsA0 - shiftConst/2;
  const mM = meanH - meanA + avH - avA, mT = meanH + meanA + 0.1*(avH+avA);
  const {vM, vT} = vegasNumbers(G);
  const w = settings.vegas;
  if(w>0 && (isFinite(vM) || isFinite(vT))){
    const dM = isFinite(vM) ? w*(vM-mM) : 0, dT = isFinite(vT) ? w*(vT-mT) : 0;
    meanH += dT/2 + dM/2; meanA += dT/2 - dM/2;
    F.push({k:"vegas", t:"Market blend", v:dM, d:`${Math.round(w*100)}% pull toward the Vegas line${isFinite(vT)?`; total moved ${sgn(dT)}`:""}. Change this in Settings.`});
  }
  const team = (meta, R, Pl, mean0) => {
    const exp = Pl.players.reduce((s,p)=>s+p.prob*p.min*p.rate.pts,0);
    return {meta, R, ps:Pl.players, unknown:Pl.unknown, meanPts:mean0, cov:clamp(exp/Math.max(1,mean0), 0.8, 1)};
  };
  return {G, lg, P, F, meanH, meanA, home:team(H, RH, PH, meanH), away:team(A, RA, PA, meanA), spotH, spotA, vM, vT, thin: RH.n<3 || RA.n<3};
}

/* ================= simulation ================= */
function allocate(T, pts, margin, i, ot){
  const ps = T.ps;
  // minutes freed by absences, measured against the lineup he has actually been playing with lately
  const freed = {G:0,F:0,C:0}, onG = {G:0,F:0,C:0};
  let onAll = 0;
  for(const p of ps){
    if(p.on){ onG[p.g]+=p.min; onAll+=p.min; freed[p.g] -= p.min*(1-p.rs); }
    else freed[p.g] += p.min*p.rs;
  }
  let spill = 0;
  for(const g in freed) if(!onG[g]){ spill += freed[g]; freed[g] = 0; }
  for(const p of ps){
    if(!p.on) continue;
    let m = p.min + freed[p.g]*p.min/onG[p.g];
    const cap = Math.min(40, p.min+10);
    if(m>cap){ spill += m-cap; m = cap; }
    p._m = Math.max(p.min*0.5, m);
  }
  if(spill && onAll) for(const p of ps) if(p.on) p._m = Math.min(42, p._m + spill*p.min/onAll);
  const blow = Math.abs(margin)>=15 ? Math.min(0.3, (Math.abs(margin)-13)*0.025) : 0;
  let cut = 0, benchMin = 0;
  for(const p of ps){
    if(!p.on) continue;
    if(p.starter && blow){ const c = p._m*blow; p._m -= c; cut += c; } else if(!p.starter) benchMin += p._m;
  }
  const otF = 1 + ot*5/48;
  let W = 0;
  for(const p of ps){ if(!p.on) continue; if(!p.starter && benchMin) p._m += cut*p._m/benchMin; p._m *= otF; W += p._m*p.rate.pts; }
  const tracked = pts*T.cov, lift = pts/Math.max(60,T.meanPts);
  for(const p of ps){
    if(!p.on){ p.s.min[i]=NaN; continue; }
    p.on_n++;
    const base = W>0 ? tracked*p._m*p.rate.pts/W : 0;
    p.s.min[i] = p._m;
    p.s.pts[i] = Math.max(0, Math.round(base*(1+gauss()*p.cv)));
    p.s.reb[i] = negbin(p._m*p.rate.reb, 7);
    p.s.ast[i] = negbin(p._m*p.rate.ast*Math.pow(lift,0.8), 7);
    p.s.tpm[i] = Math.min(p.s.pts[i]/3|0, negbin(p._m*p.rate.tpm*Math.pow(lift,0.6), 5));
  }
}

function simulate(M, N){
  const H = M.home, A = M.away;
  for(const T of [H,A]) for(const p of T.ps){ p.on_n=0; p.s = {min:new Float32Array(N), pts:new Float32Array(N), reb:new Float32Array(N), ast:new Float32Array(N), tpm:new Float32Array(N)}; }
  const hp = new Int16Array(N), ap = new Int16Array(N);
  let ots = 0;
  const effSD = 7.2;
  for(let i=0;i<N;i++){
    let dH = 0, dA = 0;
    for(const p of H.ps){ p.on = Math.random()<p.prob; dH += ((p.on?1:0)-p.share)*p.impact; }
    for(const p of A.ps){ p.on = Math.random()<p.prob; dA += ((p.on?1:0)-p.share)*p.impact; }
    const poss = M.P + gauss()*3.8;
    const mh = M.meanH + 0.55*dH - 0.45*dA, ma = M.meanA + 0.55*dA - 0.45*dH;
    const eh = 100*mh/M.P, ea = 100*ma/M.P;
    let h = Math.round(poss*(eh+gauss()*effSD)/100), a = Math.round(poss*(ea+gauss()*effSD)/100);
    let ot = 0;
    while(h===a && ot<4){ ot++; const op = poss*5/48; h += Math.max(0, Math.round(op*(eh+gauss()*15)/100)); a += Math.max(0, Math.round(op*(ea+gauss()*15)/100)); }
    if(h===a){ if(Math.random()<0.5) h++; else a++; }
    if(ot) ots++;
    hp[i]=h; ap[i]=a;
    allocate(H, h, h-a, i, ot); allocate(A, a, a-h, i, ot);
  }
  return {N, hp, ap, ots};
}

const qtile = (sorted, q) => sorted.length ? sorted[Math.min(sorted.length-1, Math.floor(q*sorted.length))] : NaN;
function summarize(M, R){
  const N = R.N; let hw = 0, cov = 0, push = 0, over = 0, opush = 0;
  const margins = new Float32Array(N), totals = new Float32Array(N);
  const {vM, vT} = M;
  for(let i=0;i<N;i++){
    const m = R.hp[i]-R.ap[i], tt = R.hp[i]+R.ap[i];
    margins[i]=m; totals[i]=tt; if(m>0) hw++;
    if(isFinite(vM)){ const x = vM>=0 ? m-vM : -m-(-vM); if(x>0) cov++; else if(x===0) push++; }
    if(isFinite(vT)){ if(tt>vT) over++; else if(tt===vT) opush++; }
  }
  const sm = Float32Array.from(margins).sort(), st = Float32Array.from(totals).sort();
  const shp = Float32Array.from(R.hp).sort(), sap = Float32Array.from(R.ap).sort();
  const players = {};
  for(const T of [M.home, M.away]) for(const p of T.ps){
    const o = {play: p.on_n/N};
    for(const k of ["min","pts","reb","ast","tpm"]){
      const v = Array.from(p.s[k]).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
      o[k] = {mean:mean(v), p10:qtile(v,0.1), p50:qtile(v,0.5), p90:qtile(v,0.9)};
    }
    const pra = []; for(let i=0;i<N;i++) if(!isNaN(p.s.min[i])) pra.push(p.s.pts[i]+p.s.reb[i]+p.s.ast[i]);
    pra.sort((a,b)=>a-b); o.pra = {mean:mean(pra), p10:qtile(pra,0.1), p50:qtile(pra,0.5), p90:qtile(pra,0.9)};
    players[p.id] = o;
    delete p.s;   // free memory
  }
  return {N, winH: hw/N, meanH: mean(Array.from(R.hp)), meanA: mean(Array.from(R.ap)), medH:qtile(shp,0.5), medA:qtile(sap,0.5),
          margin: mean(Array.from(margins)), total: mean(Array.from(totals)), m10:qtile(sm,0.1), m90:qtile(sm,0.9), t10:qtile(st,0.1), t90:qtile(st,0.9),
          ot: R.ots/N, cover: isFinite(vM) ? cov/N : NaN, push: isFinite(vM) ? push/N : NaN, over: isFinite(vT) ? over/N : NaN, opush: isFinite(vT)? opush/N : NaN,
          hist: histogram(margins), players};
}
function histogram(margins){
  const lo=-36, hi=36, w=3, bins = new Array((hi-lo)/w).fill(0);
  for(const m of margins){ const b = Math.floor((clamp(m,lo,hi-0.01)-lo)/w); bins[b]++; }
  return {lo, w, bins};
}
const fairML = p => { if(!(p>0&&p<1)) return "–"; return p>=0.5 ? "−"+Math.round(100*p/(1-p)) : "+"+Math.round(100*(1-p)/p); };

/* ================= schedule (home) ================= */
function parseOdds(c, home, away){
  const o = (c.odds||[])[0]; if(!o) return {};
  const total = parseFloat(o.overUnder);
  let fav = null, spread = NaN;
  const det = String(o.details||"");
  const m = det.match(/^([A-Z]{2,4})\s*([+-]?\d+(\.\d+)?)/);
  if(m){ spread = Math.abs(parseFloat(m[2])); fav = m[1]===home.abbr ? home.id : m[1]===away.abbr ? away.id : null; }
  else if(isFinite(parseFloat(o.spread))){ const s = parseFloat(o.spread); spread = Math.abs(s); fav = s<0 ? home.id : away.id; }
  if(/\b(even|pk|pick)\b/i.test(det)){ spread = 0; fav = null; }
  return {total: isFinite(total) ? total : NaN, spread, fav, details:det};
}
async function loadGames(){
  state.games = null; state.gamesErr = null; renderHome();
  const want = state.day;
  try{
    const j = await getJSON(`${S}/site/v2/sports/basketball/nba/scoreboard?dates=${want}`);
    if(state.day!==want) return;
    state.games = (j.events||[]).map(e=>{
      const c = e.competitions?.[0]||{};
      const team = h => { const x = (c.competitors||[]).find(t=>t.homeAway===h); if(!x) return null;
        const rec = (x.records||[]).find(r=>r.type==="total"||r.name==="overall")?.summary || "";
        return {id:String(x.team?.id||x.id), abbr:x.team?.abbreviation, name:x.team?.shortDisplayName||x.team?.name, logo:x.team?.logo||teamById(x.team?.id)?.logo,
                color:x.team?.color, rec, score: parseInt(x.score?.value ?? x.score)}; };
      const st = c.status?.type || e.status?.type || {};
      const away = team("away"), home = team("home");
      return {id:String(e.id), date:new Date(e.date), away, home, state:st.state, odds: away&&home ? parseOdds(c, home, away) : {},
              status: st.state==="pre" ? new Date(e.date).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : (st.shortDetail||st.description||"")};
    }).filter(g=>g.away && g.home);
    // first visit: if today's slate is over (or empty), jump to tomorrow
    if(!state.autoAdvanced && want===etYMD(new Date()) && (!state.games.length || state.games.every(g=>g.state==="post"))){
      state.autoAdvanced = true; state.day = shiftDay(want,1); return loadGames();
    }
    state.autoAdvanced = true;
  }catch(err){ state.gamesErr = err.message; }
  renderHome();
}

function resultLine(g){
  const r = state.results[g.id];
  if(!r) return `<div class="res"><span class="tap">Tap to simulate</span><span class="muted">›</span></div>`;
  const hw = r.winH>=0.5, fav = hw ? g.home : g.away, p = hw ? r.winH : 1-r.winH;
  let actual = "";
  if(g.state==="post" && isFinite(g.home.score)){
    const right = (g.home.score>g.away.score) === hw;
    actual = ` <span class="${right?"good":"bad"}">${right?"✓":"✗"}</span>`;
  }
  return `<div class="res"><span><b>${esc(fav.abbr)}</b> wins <b class="n">${pct(p)}</b>${actual}</span>
    <span><span class="n">${Math.round(r.meanA)}</span> – <span class="n">${Math.round(r.meanH)}</span></span></div>`;
}

function renderHome(){
  state.view = "home";
  let list;
  const today = etYMD(new Date()), tmr = shiftDay(today,1);
  if(state.gamesErr) list = `<div class="err">Couldn’t load the schedule (${esc(state.gamesErr)}). Check your connection and pull to refresh.</div>`;
  else if(!state.games) list = `<div class="loading"><div class="spin"></div>Loading the schedule…</div>`;
  else if(!state.games.length) list = `<div class="empty">No NBA games on this day. Use the arrows to find the next slate.</div>`;
  else list = `<div class="games">${state.games.map((g,i)=>`
      <button class="game" data-gi="${i}">
        <div class="gr">
          <span class="tm"><img src="${esc(g.away.logo)}" alt=""><span>${esc(g.away.abbr)}<br><small>${esc(g.away.rec)}</small></span></span>
          <span class="mid">${g.state==="post"&&isFinite(g.away.score)?`<b class="n" style="font-size:17px;color:var(--text)">${g.away.score}–${g.home.score}</b><br>`:"@ "}${esc(g.status)}${g.odds.details?`<br>${esc(g.odds.details)}${isFinite(g.odds.total)?`, O/U ${g.odds.total}`:""}`:""}</span>
          <span class="tm"><span style="text-align:right">${esc(g.home.abbr)}<br><small>${esc(g.home.rec)}</small></span><img src="${esc(g.home.logo)}" alt=""></span>
        </div>
        ${resultLine(g)}
      </button>`).join("")}</div>`;
  const sa = state.simAll;
  const allBtn = state.games?.length ? `<button class="go" id="simall" ${sa?"disabled":""}>${sa?`Simulating ${sa.i} of ${sa.n}…`:"Simulate all games"}</button>` : "";
  $("#app").innerHTML = `
    <div class="datebar"><button id="prev" aria-label="Previous day">‹</button><div class="d">${esc(dayLabel(state.day))}</div><button id="next" aria-label="Next day">›</button></div>
    <div class="quick"><button data-day="${today}" aria-pressed="${state.day===today}">Today</button><button data-day="${tmr}" aria-pressed="${state.day===tmr}">Tomorrow</button></div>
    <div class="section"><h2><span>Scheduled games</span>${allBtn}</h2>${list}</div>`;
}

async function simAll(){
  const games = state.games.slice();
  state.simAll = {i:0, n:games.length}; renderHome();
  const N = Math.min(settings.sims, 5000);
  for(const G of games){
    state.simAll.i++; if(state.view==="home") renderHome();
    if(state.results[G.id]) continue;
    try{
      await loadForGame(G, ()=>{});
      const M = buildModel(G);
      await tick();
      state.results[G.id] = summarize(M, simulate(M, N));
    }catch(e){}
    if(state.view==="home") renderHome();
  }
  state.simAll = null;
  if(state.view==="home") renderHome();
}

let runId = 0;
function heroHTML(){
  const G = state.game, A = G.away, H = G.home;
  return `<div class="hero" style="--teamA:${esc(cleanColor(A.color)||"#3a6fd8")};--teamB:${esc(cleanColor(H.color)||"#c98a12")}">

    <div class="row">
      <div class="side"><img src="${esc(A.logo)}" alt="">${esc(A.name)}<small>${esc(A.rec)} · away</small></div>
      <div class="at">@</div>
      <div class="side"><img src="${esc(H.logo)}" alt="">${esc(H.name)}<small>${esc(H.rec)} · home</small></div>
    </div>
    <div class="odds">${G.date ? esc(G.date.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"})) : ""}${G.odds?.details?` · Vegas ${esc(G.odds.details)}${isFinite(G.odds.total)?`, total ${G.odds.total}`:""}`:""}</div>
  </div>`;

function step(msg, frac){
  $("#app").innerHTML = `${heroHTML()}<div class="loading"><div class="spin"></div>${esc(msg)}${frac!=null?`<div class="bar"><i style="width:${Math.round(frac*100)}%"></i></div>`:""}</div>`;
}
async function openGame(G, keepTab){
  const my = ++runId;
  state.view = "game"; state.game = G; state.open = null; state.M = null;
  if(!keepTab) state.tab = G.away.id;
  window.scrollTo(0,0);
  try{
    await loadForGame(G, (m,f)=>{ if(my===runId) step(m,f); });
    if(my!==runId) return;
    step(`Running ${settings.sims.toLocaleString()} simulations…`, 0.97);
    await tick();
    const M = buildModel(G);
    const S_ = summarize(M, simulate(M, settings.sims));
    if(my!==runId) return;
    state.M = M; state.S = S_; state.results[G.id] = S_;
    renderGame();
  }catch(err){
    if(my===runId) $("#app").innerHTML = `${heroHTML()}<div class="err">Couldn’t finish loading: ${esc(err.message)}. Go back and tap the game again.</div>`;
  }
}

function histSVG(S, H, A){
  const {lo, w, bins} = S.hist, max = Math.max(...bins), W = 360, Hh = 110, bw = W/bins.length;
  const ca = cleanColor(A.color)||"#3a6fd8", ch = cleanColor(H.color)||"#c98a12";
  const bars = bins.map((c,i)=>{
    const h = max ? c/max*(Hh-18) : 0, x0 = lo+i*w, col = x0+w/2 > 0 ? ch : ca;
    return `<rect x="${(i*bw+1).toFixed(1)}" y="${(Hh-14-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}" opacity="0.85"><title>${x0>0?H.abbr+" by "+x0+"–"+(x0+w):x0+w<=0?A.abbr+" by "+(-x0-w)+"–"+(-x0):"Within 1"}: ${pct(c/S.N)}</title></rect>`;
  }).join("");
  const zx = (-lo)/w*bw;
  const labels = [-30,-15,0,15,30].map(v=>`<text x="${((v-lo)/w*bw).toFixed(1)}" y="${Hh-2}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".6">${v===0?"0":Math.abs(v)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Distribution of final margins">${bars}<line x1="${zx}" x2="${zx}" y1="0" y2="${Hh-14}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/>${labels}</svg>`;
}

function renderGame(){
  const M = state.M, S = state.S, G = M.G, H = G.home, A = G.away;
  const hw = S.winH>=0.5;
  const ca = cleanColor(A.color)||"#3a6fd8", ch = cleanColor(H.color)||"#c98a12";
  const marginTeam = S.margin>=0 ? H : A;
  // vegas lines
  let vegas = "";
  if(isFinite(M.vM)){
    const favT = M.vM>=0 ? H : A, spr = Math.abs(M.vM);
    vegas += `<span>${esc(favT.abbr)} −${f1(spr)} covers</span><span class="n ${S.cover>=0.55?"good":S.cover<=0.45?"bad":""}">${pct(S.cover)}</span>
      <span class="sub">Model line: ${esc(marginTeam.abbr)} −${f1(Math.abs(S.margin))} · edge ${f1(Math.abs(Math.abs(S.margin)*(S.margin*M.vM>=0?1:-1)-spr))} pts${S.push>0.005?` · push ${pct(S.push)}`:""}</span>`;
  }
  if(isFinite(M.vT)){
    vegas += `<span>Over ${f1(M.vT)}</span><span class="n ${S.over>=0.55?"good":S.over<=0.45?"bad":""}">${pct(S.over)}</span>
      <span class="sub">Model total ${f1(S.total)} (80% range ${S.t10}–${S.t90})</span>`;
  }
  const final = G.state==="post" && isFinite(H.score) ? `<div class="actual">Final: ${esc(A.abbr)} ${A.score} – ${esc(H.abbr)} ${H.score}. The model used only games played before tip-off.</div>` : "";

  const facs = M.F.map(f=>{
    const tm = f.v>0.05 ? H.abbr : f.v<-0.05 ? A.abbr : "";
    return `<div class="fac"><div><div class="t">${esc(f.t)}</div><div class="d">${esc(f.d)}</div></div>
      <div class="v"><span class="n">${Math.abs(f.v)<0.05?"0.0":"+"+Math.abs(f.v).toFixed(1)}</span><span>${esc(tm||"even")}</span></div></div>`;
  }).join("");
  const tot = M.F.reduce((s,f)=>s+f.v,0);

  const injRows = [M.away, M.home].flatMap(T=>[...T.ps.filter(p=>p.status), ...T.unknown].map(p=>({p, T}))).map(({p,T})=>{
    const im = isFinite(p.impact) ? (p.prob-p.share)*p.impact : NaN;
    return `<div class="inj-row"><div><b>${esc(p.name)}</b> <span class="muted">${esc(T.meta.abbr)} · ${esc(p.pos)}</span><div class="sub">${esc(p.why||p.status)}${isFinite(p.share)?` · played ${Math.round(p.share*100)}% of recent games`:" · no recent games"}</div></div>
      <span class="pill ${pillClass(p.prob)}">${esc(p.status)}</span>
      <span class="n ${im<0?"bad":im>0?"good":"muted"}" title="Effect on team margin">${isFinite(im)?sgn(im):"–"}</span></div>`;
  }).join("") || `<div class="empty">No one on either injury report.</div>`;

  const T = state.tab===H.id ? M.home : M.away;
  const rows = T.ps.filter(p=>p.min>=6 || p.prob<1).map(p=>{
    const o = S.players[p.id]; if(!o) return "";
    const off = p.prob===0;
    const open = state.open===p.id;
    const sub = off ? "Out" : p.prob<1 ? `${pct(o.play)} to play` : `${esc(p.pos)}${p.starter?" · starter":""}`;
    const v = k => off ? "–" : f1(o[k].mean);
    let detail = "";
    if(open && !off){
      const oppAbbr = (T===M.home?A:H).abbr;
      const matchup = ["pts","reb","ast","tpm"].map(k=>({k, f:p.oppF[k]})).filter(x=>Math.abs(x.f-1)>=0.03)
        .map(x=>`${{pts:"points",reb:"rebounds",ast:"assists",tpm:"threes"}[x.k]} ${x.f>1?"+":"−"}${Math.round(Math.abs(x.f-1)*100)}%`);
      detail = `<div class="detail"><table><thead><tr><th></th><th>Low</th><th>Median</th><th>High</th><th>Avg</th></tr></thead><tbody>
        ${[["MIN","min"],["PTS","pts"],["REB","reb"],["AST","ast"],["3PM","tpm"],["PRA","pra"]].map(([l,k])=>`<tr><td>${l}</td><td class="n">${f1(o[k].p10)}</td><td class="n">${f1(o[k].p50)}</td><td class="n">${f1(o[k].p90)}</td><td class="n">${f1(o[k].mean)}</td></tr>`).join("")}
        </tbody></table>
        <p class="why">Low and high are the 10th and 90th percentile across ${S.N.toLocaleString()} simulations, counting only games he plays.</p>
        <p class="why"><b>Matchup:</b> ${matchup.length ? `${esc(oppAbbr)} gives ${POS_NAME[p.g]} ${matchup.join(", ")} vs league average` : `${esc(oppAbbr)} defends ${POS_NAME[p.g]} about league average`}. Pace factor ${f1((p.env-1)*100)}%.</p>
        ${p.notes.length?`<p class="why">${p.notes.map(esc).join(". ")}.</p>`:""}
        ${(state.game&&((T===M.home?M.spotH:M.spotA).b2b))?`<p class="why">Back-to-back: minutes trimmed 3%.</p>`:""}
        <p class="why">Built from ${p.gp} game${p.gp>1?"s":""} with this team. Game score per 36: ${f1(p.gm36)}.</p></div>`;
    }
    return `<button class="pr${off?" dim":""}" data-pid="${esc(p.id)}" aria-expanded="${open}">
        <span class="who"><img src="${head(esc(p.id))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span>${esc(p.name)}<small>${sub}</small></span></span>
        <span class="n">${off?"–":Math.round(o.min.mean)}</span><span class="n">${v("pts")}</span><span class="n">${v("reb")}</span><span class="n">${v("ast")}</span><span class="n">${v("tpm")}</span>
      </button>${detail}`;
  }).join("");

  $("#app").innerHTML = `${heroHTML()}
    <div class="card"><h3>Simulation result <small>${S.N.toLocaleString()} games</small></h3>
      <div class="score">
        <div class="s"><img src="${esc(A.logo)}" alt=""><span class="n ${!hw?"win":""}">${Math.round(S.meanA)}</span></div>
        <span class="dash">–</span>
        <div class="s"><span class="n ${hw?"win":""}">${Math.round(S.meanH)}</span><img src="${esc(H.logo)}" alt=""></div>
      </div>
      <div class="wp"><div class="lab"><span>${esc(A.abbr)} ${pct(1-S.winH)}</span><span>${esc(H.abbr)} ${pct(S.winH)}</span></div>
        <div class="track"><i style="width:${(1-S.winH)*100}%;background:${ca}"></i><i style="width:${S.winH*100}%;background:${ch}"></i></div></div>
      <div class="kv">
        <span>Projected winner</span><span class="n">${esc((hw?H:A).abbr)} by ${f1(Math.abs(S.margin))}</span>
        <span class="sub">80% of simulations land between ${esc(S.m10<0?A.abbr+" by "+(-S.m10):H.abbr+" by "+S.m10)} and ${esc(S.m90<0?A.abbr+" by "+(-S.m90):H.abbr+" by "+S.m90)}</span>
        <span>Fair moneyline</span><span class="n">${esc(A.abbr)} ${fairML(1-S.winH)} / ${esc(H.abbr)} ${fairML(S.winH)}</span>
        <span>Goes to overtime</span><span class="n">${pct(S.ot)}</span>
        ${vegas}
      </div>
      ${final}
      ${M.thin?`<div class="actual">Early-season sample: fewer than 3 games of data for at least one team, so ratings lean on league averages.</div>`:""}
    </div>

    <div class="card"><h3>Final margin <small>how often each result came up</small></h3>
      <div class="hist">${histSVG(S,H,A)}<div class="cap"><span>← ${esc(A.abbr)} wins by</span><span>${esc(H.abbr)} wins by →</span></div></div>
    </div>

    <div class="card"><h3>What moved the number <small>points of margin</small></h3>
      ${facs}
      <div class="fac total"><div><div class="t">Expected margin</div><div class="d">Before game-to-game randomness</div></div>
        <div class="v"><span class="n">${Math.abs(tot).toFixed(1)}</span><span>${esc(tot>=0?H.abbr:A.abbr)}</span></div></div>
    </div>

    <div class="card"><h3>Injury report <small>effect on margin</small></h3>${injRows}</div>

    <div class="card"><h3>Player projections <small>tap a player</small></h3>
      <div class="tabs">
        <button data-tab="${A.id}" aria-pressed="${state.tab===A.id}"><img src="${esc(A.logo)}" alt="">${esc(A.abbr)}</button>
        <button data-tab="${H.id}" aria-pressed="${state.tab===H.id}"><img src="${esc(H.logo)}" alt="">${esc(H.abbr)}</button>
      </div>
      <div class="plist">
        <div class="pr hd"><span>Player</span><span>MIN</span><span>PTS</span><span>REB</span><span>AST</span><span>3PM</span></div>
        ${rows || `<div class="empty">No recent box scores for this roster yet.</div>`}
      </div>
    </div>`;
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="setbtn"){ const s=$("#settings"); s.hidden=!s.hidden; b.setAttribute("aria-expanded", String(!s.hidden)); if(!s.hidden) renderSettings(); return; }
  const seg = b.closest(".seg");
  if(seg){ const k = seg.dataset.set; settings[k] = parseFloat(b.dataset.v); saveSettings(); renderSettings();
    if(k!=="sims") state.results = {};
    if(state.view==="game" && state.game) openGame(state.game, true); else renderHome(); return; }
  if(b.id==="prev"||b.id==="next"){ state.day = shiftDay(state.day, b.id==="next"?1:-1); state.autoAdvanced = true; loadGames(); return; }
  if(b.dataset.day){ state.day = b.dataset.day; state.autoAdvanced = true; loadGames(); return; }
  if(b.id==="simall"){ simAll(); return; }
  if(b.classList.contains("game")){ openGame(state.games[+b.dataset.gi]); return; }
  if(b.classList.contains("back")){ runId++; state.M = null; renderHome(); window.scrollTo(0,0); return; }
  if(b.classList.contains("rerun")){ openGame(state.game, true); return; }
  if(b.dataset.tab){ state.tab = b.dataset.tab; state.open = null; renderGame(); return; }
  if(b.dataset.pid){ state.open = state.open===b.dataset.pid ? null : b.dataset.pid; renderGame(); return; }
});

loadGames();
</script>
</body>
</html>
